<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyPod 配网</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }
        .logo p {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        select, input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #4caf50;
        }
        .status.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef5350;
        }
        .loading {
            display: none;
            text-align: center;
            color: #666;
            margin-top: 15px;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .wifi-icon {
            font-size: 48px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="wifi-icon">📶</div>
            <h1>LuckyPod</h1>
            <p>智能配网助手</p>
        </div>

        <form id="configForm">
            <div class="form-group">
                <label for="wifi-ssid">选择 WiFi 网络</label>
                <select id="wifi-ssid" required>
                    <option value="">扫描中...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="wifi-password">WiFi 密码</label>
                <input type="password" id="wifi-password" placeholder="输入 WiFi 密码" required>
            </div>

            <button type="submit" class="btn">连接网络</button>
        </form>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>正在连接...</p>
        </div>

        <div id="status" class="status"></div>
    </div>

    <script>
        // 加载 WiFi 列表
        function loadWifiList() {
            fetch('/cgi-bin/get_wifi_list')
                .then(response => response.json())
                .then(data => {
                    const select = document.getElementById('wifi-ssid');
                    select.innerHTML = '';
                    
                    if (data.data && data.data.length > 0) {
                        // 按信号强度排序
                        data.data.sort((a, b) => b.rssi - a.rssi);
                        
                        data.data.forEach(wifi => {
                            const option = document.createElement('option');
                            option.value = wifi.ssid;
                            option.textContent = wifi.ssid + (wifi.security ? ' 🔒' : '');
                            select.appendChild(option);
                        });
                    } else {
                        select.innerHTML = '<option value="">未找到 WiFi 网络</option>';
                    }
                })
                .catch(error => {
                    console.error('加载 WiFi 列表失败:', error);
                    document.getElementById('wifi-ssid').innerHTML = '<option value="">扫描失败</option>';
                });
        }

        // 连接 WiFi
        function connectWifi(ssid, password) {
            const loading = document.getElementById('loading');
            const status = document.getElementById('status');
            const btn = document.querySelector('.btn');

            loading.style.display = 'block';
            status.style.display = 'none';
            btn.disabled = true;

            fetch(`/cgi-bin/connect_wifi?ssid=${encodeURIComponent(ssid)}&password=${encodeURIComponent(password)}`)
                .then(response => response.json())
                .then(data => {
                    loading.style.display = 'none';
                    btn.disabled = false;

                    status.style.display = 'block';
                    
                    if (data.status === 'success') {
                        status.className = 'status success';
                        status.innerHTML = '✅ 配网成功！设备将在 3 秒后重启';
                        
                        // 3 秒后刷新页面（设备可能已重启）
                        setTimeout(() => {
                            window.location.reload();
                        }, 3000);
                    } else {
                        status.className = 'status error';
                        status.innerHTML = '❌ ' + (data.message || '连接失败，请重试');
                    }
                })
                .catch(error => {
                    loading.style.display = 'none';
                    btn.disabled = false;
                    status.className = 'status error';
                    status.innerHTML = '❌ 网络错误，请重试';
                    status.style.display = 'block';
                });
        }

        // 表单提交
        document.getElementById('configForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const ssid = document.getElementById('wifi-ssid').value;
            const password = document.getElementById('wifi-password').value;

            if (!ssid) {
                alert('请选择 WiFi 网络');
                return;
            }

            connectWifi(ssid, password);
        });

        // 页面加载时扫描 WiFi
        loadWifiList();

        // 每 10 秒刷新一次 WiFi 列表
        setInterval(loadWifiList, 10000);
    </script>
</body>
</html>
